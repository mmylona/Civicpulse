name: Bug report
description: Something behaves differently from what it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as citizen@demo.local
        2. ...
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: The `X-Request-Id` response header or `traceId` from the error body, if you have one.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, how the app was started (compose, ng serve, ...).
