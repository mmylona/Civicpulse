# CivicPulse local environment: `docker compose up`, then open http://localhost:8080
#
# Every variable has a development default, so no .env file is required. Copy
# .env.example to .env to change them; see that file for what each one does.

name: civicpulse

services:
  db:
    # Keep in sync with <postgis.image> in backend/pom.xml (integration tests).
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse-dev-only}
    ports:
      # Loopback only: reachable from your SQL client, not from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      CIVICPULSE_DB_URL: ${CIVICPULSE_DB_URL:-jdbc:postgresql://db:5432/civicpulse}
      POSTGRES_USER: ${POSTGRES_USER:-civicpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicpulse-dev-only}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      CIVICPULSE_CORS_ALLOWED_ORIGINS: ${CIVICPULSE_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${CIVICPULSE_LOG_FORMAT:-ecs}
    # 8080 is reached only through nginx; 8081 (actuator) only from inside the network.
    expose:
      - "8080"
      - "8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${CIVICPULSE_HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
