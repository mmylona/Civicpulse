spring:
  application:
    name: civicpulse
  datasource:
    url: ${CIVICPULSE_DB_URL:jdbc:postgresql://localhost:5432/civicpulse}
    username: ${POSTGRES_USER:civicpulse}
    password: ${POSTGRES_PASSWORD:civicpulse-dev-only}
    hikari:
      pool-name: civicpulse-db
  jpa:
    # The web layer must not lazily load entities after the transaction ends.
    open-in-view: false
    hibernate:
      # Flyway owns the schema (ADR-002); Hibernate only checks its mapping against it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  # Running behind nginx: honour X-Forwarded-* for scheme, host and client address.
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  server:
    # Separate port, never proxied by nginx (see SECURITY.md).
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true

civicpulse:
  cors:
    allowed-origins: ${CIVICPULSE_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  pattern:
    # Plain-text logs (outside Docker) show the request id; structured JSON logs carry
    # it as the `requestId` field automatically.
    correlation: "[%X{requestId:-}] "
  level:
    io.civicpulse: INFO
    org.flywaydb: INFO
