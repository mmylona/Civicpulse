<ng-container *transloco="let t">
  <a class="skip-link" href="#main-content">{{ t('app.skipToContent') }}</a>

  <header class="masthead">
    <div class="masthead__inner">
      <a class="brand" routerLink="/map">
        <svg class="brand__mark" viewBox="0 0 24 32" aria-hidden="true" focusable="false">
          <path
            d="M12 1C6 1 1.5 5.6 1.5 11.4 1.5 19 12 31 12 31s10.5-12 10.5-19.6C22.5 5.6 18 1 12 1Z"
            fill="currentColor"
          />
          <path
            d="M5.5 12h3.2l1.8-3.6 2.6 7 1.9-3.4h3.5"
            fill="none"
            stroke="var(--cp-asphalt)"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="brand__name">{{ t('app.name') }}</span>
      </a>

      <nav class="nav" [attr.aria-label]="t('app.primaryNavigation')">
        <ul>
          <li>
            <a routerLink="/map" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{
              t('nav.map')
            }}</a>
          </li>
          @if (isAdmin()) {
            <li>
              <a routerLink="/admin" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{
                t('nav.admin')
              }}</a>
            </li>
          }
        </ul>
      </nav>

      <div class="session">
        @if (user(); as user) {
          <span class="session__name">{{ user.displayName }}</span>
          <button class="session__action" type="button" (click)="signOut()">
            {{ t('nav.signOut') }}
          </button>
        } @else {
          <a class="session__action" routerLink="/login">{{ t('nav.signIn') }}</a>
        }
      </div>
    </div>
    <div class="lane-line" aria-hidden="true"></div>
  </header>

  <main id="main-content" class="page" tabindex="-1" #main>
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="tagline">{{ t('app.tagline') }}</p>
      <cp-api-status />
    </div>
  </footer>
</ng-container>
