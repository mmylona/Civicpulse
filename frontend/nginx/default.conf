server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Photo uploads are capped at 10 MB by the backend; allow a little multipart overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # API: same origin as the SPA, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Container health check; not proxied to the backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build output never changes under the same name.
    location ~* \.(?:js|css|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA entry point must always be revalidated so a deploy is picked up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (/map, /reports/123, …) all serve the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
