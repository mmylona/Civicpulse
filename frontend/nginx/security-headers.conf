# Security headers for every response nginx serves itself.
# Included at server level and again in any location that adds its own headers,
# because nginx drops inherited add_header directives in such locations.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# style-src needs 'unsafe-inline' because Angular injects component styles as <style>
# elements. Scripts stay limited to same-origin files. Map tile hosts are added to img-src
# when the map arrives (Phase 5).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
